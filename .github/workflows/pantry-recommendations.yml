name: Pantry recommendations

on:
  push:
    branches:
      - feature/pantry-recommendations-2026-10-16
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test invalid batch rollback
        run: cargo test --locked -p hungerstrike-core --test recipe_planning invalid_combined_plan_leaves_persisted_shopping_unchanged -- --exact
      - name: Test batch result messaging
        run: cargo test --locked -p hungerstrike-rust-desktop tests::batch_feedback_distinguishes_unchanged_and_retained_quantities -- --exact
      - name: Test core and desktop workspace
        run: cargo test --locked --workspace
      - name: Build native preview executable
        run: cargo build --locked -p hungerstrike-rust-desktop
      - name: Bound and hash preview executable
        shell: pwsh
        run: |
          $exe = 'target/debug/hungerstrike-rust-desktop.exe'
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -gt 314572800) { throw 'Preview executable exceeds 300 MiB cap' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          "$($item.Length) $hash" | Set-Content -LiteralPath SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hungerstrike-pantry-preview-${{ github.run_id }}
          path: |
            target/debug/hungerstrike-rust-desktop.exe
            SHA256.txt
          if-no-files-found: error
          retention-days: 1

name: Cross-platform

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep hosted runners inside their disk budget: no full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build and capture packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            xvfb mesa-vulkan-drivers libvulkan1

      - name: Install clippy
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Build release desktop binary
        run: cargo build --locked --release -p hungerstrike-rust-desktop

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/hungerstrike-rust-desktop.exe dist/
          else
            cp target/release/hungerstrike-rust-desktop dist/
          fi
          cp -R assets dist/assets
          rm -rf dist/assets/screenshots
          (cd dist && ls -l)

      - name: Headless app capture (synthetic data)
        id: capture
        timeout-minutes: 10
        shell: bash
        env:
          HUNGERSTRIKE_ASSETS_DIR: ${{ github.workspace }}/assets
          HUNGERSTRIKE_CAPTURE_DEMO: selected
          HUNGERSTRIKE_CAPTURE_EXIT: "1"
          HUNGERSTRIKE_CAPTURE_DELAY: "5"
          CAPTURE_DIR: ${{ github.workspace }}/captures
        run: |
          mkdir -p captures
          bin=target/release/hungerstrike-rust-desktop
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
            # The runner only has the WARP software DX12 adapter, which lost
            # the device at 1440x900 (DXGI 0x887A0005); render less per frame.
            export HUNGERSTRIKE_CAPTURE_SIZE=1000x700 HUNGERSTRIKE_CAPTURE_DELAY=1
          fi
          status=0
          for theme in light dark; do
            name="hungerstrike-${{ matrix.os }}-selected-$theme.png"
            out="$CAPTURE_DIR/$name"
            export HUNGERSTRIKE_CAPTURE_THEME=$theme
            export HUNGERSTRIKE_CAPTURE_PATH="$out"
            export HUNGERSTRIKE_DATA_DIR="$RUNNER_TEMP/hs-capture-$theme"
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a -s "-screen 0 1920x1080x24" "$bin" > "captures/$theme.log" 2>&1 || status=$?
            else
              "$bin" > "captures/$theme.log" 2>&1 || status=$?
            fi
            tail -n 40 "captures/$theme.log"
            if [ -s "captures/$name" ]; then echo "captured captures/$name"; else echo "::error::no capture written for $theme"; status=1; fi
          done
          exit $status

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hungerstrike-screenshots-${{ matrix.os }}
          path: captures/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: hungerstrike-desktop-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

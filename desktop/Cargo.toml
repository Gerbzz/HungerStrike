[package]
name = "hungerstrike-rust-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "hungerstrike_rust_desktop"

[dependencies]
hungerstrike-core = { path = "../core" }
bevy = { version = "0.18.0", default-features = false, features = [
    "default_app", "std", "3d_bevy_render", "ui_bevy_render", "scene", "picking",
    "bevy_winit", "default_font", "multi_threaded", "sysinfo_plugin",
] }
bevy_egui = { version = "0.39.0", default-features = false, features = ["accesskit", "manage_clipboard", "default_fonts", "render", "bevy_ui", "picking"] }
chrono = "0.4"
serde_json = "1"
tempfile = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.16"

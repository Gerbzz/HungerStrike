[package]
name = "hungerstrike-rust-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
hungerstrike-core = { path = "../core" }
bevy = { version = "0.18.0", default-features = false, features = ["3d", "jpeg"] }
bevy_egui = { version = "0.39.0", default-features = false, features = ["accesskit", "manage_clipboard", "default_fonts", "render", "bevy_ui", "picking"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
winit = { version = "=0.30.13", default-features = false }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26.0", default-features = false, features = ["rten_format"] }
rten-imageproc = "0.26.0"
chrono = "0.4"
serde_json = "1"
tempfile = "3"
rfd = "0.16"
dirs = "6"

# Linux: read the desktop light/dark preference from the XDG portal (winit
# does not report it on X11). ashpd is already used by rfd's portal backend.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
pollster = "0.4"

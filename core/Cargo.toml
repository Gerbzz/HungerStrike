[package]
name = "hungerstrike-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
sha2 = "0.10"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
chrono = "0.4"

tempfile = "3"

[package]
name = "hungerstrike-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
hungerstrike-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
